<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interval Timer</title>
<style>
  :root {
    --idle: #15171a;
    --prep: #8a5300;
    --work: #b3261e;
    --rest: #1d5ba3;
    --done: #1e7a3c;
    --ended: #3a4048;
    --bg: var(--idle);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    transition: background-color .5s ease;
  }
  body.prep { --bg: var(--prep); }
  body.work { --bg: var(--work); }
  body.rest { --bg: var(--rest); }
  body.done { --bg: var(--done); }
  body.ended { --bg: var(--ended); }
  [hidden] { display: none !important; }

  /* ---------- start screen ---------- */
  #start { height: 100%; display: flex; padding: 16px; overflow-y: auto; }
  .card { width: min(560px, 100%); margin: auto; }   /* auto margins center without clipping the top when it overflows */
  .card h1 { font-size: 2.2rem; margin: 0 0 .25rem; }
  .card .sub { opacity: .65; margin: 0 0 1.5rem; }
  .plan { list-style: none; padding: 0; margin: 0 0 1.5rem; border-top: 1px solid #ffffff22; }
  .plan li {
    display: flex; align-items: center; gap: .75rem;
    padding: .55rem 0; border-bottom: 1px solid #ffffff22; font-size: 1.05rem;
  }
  .plan .dot { width: .7rem; height: .7rem; border-radius: 50%; flex: none; }
  .plan .dur { margin-left: auto; font-variant-numeric: tabular-nums; opacity: .8; }
  .plan .total { font-weight: 600; }
  .plan li.dim { opacity: .35; }
  .plan li > button {
    all: unset; flex: 1; display: flex; align-items: center; gap: .75rem; cursor: pointer;
  }
  .plan li:has(> button):hover { background: #ffffff0d; }
  .plan li > button:focus-visible { outline: 2px solid #fff; outline-offset: 4px; border-radius: 4px; }
  .plan .here {
    font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
    background: #fff; color: var(--idle); border-radius: 99px; padding: .1rem .5rem;
  }
  .plan .adj { margin-left: auto; display: flex; align-items: center; gap: .4rem; }
  .plan .adj .dur { margin-left: 0; min-width: 2.8em; text-align: center; }
  .plan .adj button { padding: 0; width: 1.9rem; height: 1.9rem; border-radius: 6px; line-height: 1; }
  .plan .dur.changed { font-weight: 700; opacity: 1; }
  .hint { margin: -1rem 0 1.5rem; font-size: .85rem; opacity: .5; }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; margin-bottom: 1.25rem; }
  .modes label {
    display: flex; flex-direction: column; gap: .2rem; cursor: pointer;
    padding: .8rem 1rem; border-radius: 10px; border: 2px solid #ffffff22;
  }
  .modes label span { font-size: .85rem; opacity: .65; }
  .modes label:has(input:checked) { border-color: #fff; background: #ffffff14; }
  .modes label:has(input:focus-visible) { outline: 2px solid #fff; outline-offset: 2px; }
  .modes input { position: absolute; opacity: 0; pointer-events: none; }
  @media (max-width: 480px) { .modes { grid-template-columns: 1fr; } }
  .resume {
    display: flex; flex-wrap: wrap; gap: .25rem .75rem; align-items: baseline;
    background: #1e7a3c55; border: 1px solid #1e7a3c; border-radius: 10px; padding: .75rem 1rem; margin-bottom: 1.25rem;
  }
  button.link { background: none; padding: 0; text-decoration: underline; opacity: .85; }
  button.link:hover { background: none; opacity: 1; }
  .controls { display: flex; flex-wrap: wrap; gap: 1rem 1.5rem; align-items: center; margin-bottom: 1.5rem; opacity: .9; }
  .controls label { display: flex; align-items: center; gap: .5rem; cursor: pointer; }
  .buttons { display: flex; gap: .75rem; }
  button {
    font: inherit; color: #fff; border: 0; border-radius: 10px; cursor: pointer;
    padding: .9rem 1.4rem; background: #ffffff1f;
  }
  button:hover { background: #ffffff33; }
  button.primary { background: var(--work); font-size: 1.25rem; font-weight: 700; flex: 1; }
  button.primary:hover { filter: brightness(1.15); }
  .error { background: #b3261e44; border: 1px solid #b3261e; padding: 1rem; border-radius: 10px; }

  /* ---------- history ---------- */
  .history { margin-top: 2.5rem; }
  .history h2 { font-size: .8rem; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; opacity: .6; margin: 0 0 .5rem; }
  .history ol { list-style: none; padding: 0; margin: 0; border-top: 1px solid #ffffff22; }
  .history li { border-bottom: 1px solid #ffffff22; }
  .history summary {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: .25rem .75rem;
    padding: .55rem .25rem; cursor: pointer; list-style: none;
  }
  .history summary::-webkit-details-marker { display: none; }
  .history summary:hover { background: #ffffff0d; }
  .history summary:focus-visible { outline: 2px solid #fff; outline-offset: 2px; border-radius: 4px; }
  .history .rounds { margin-left: auto; font-variant-numeric: tabular-nums; }
  .history .rounds b { font-size: 1.1rem; }
  .tag { min-width: 7.2em; text-align: center; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; border-radius: 99px; padding: .1rem .5rem; background: #ffffff22; }
  .tag.completed { background: var(--done); }
  .tag.gave_up { background: var(--prep); }
  .history table { width: 100%; border-collapse: collapse; font-size: .9rem; font-variant-numeric: tabular-nums; margin: .1rem 0 .5rem; }
  .history td { padding: .2rem .75rem .2rem .25rem; }
  .history td:last-child { padding-right: .25rem; text-align: right; }
  .history tr.restrow td { opacity: .6; }
  .history .meta { display: flex; flex-wrap: wrap; gap: .25rem 1rem; justify-content: space-between; font-size: .85rem; opacity: .65; padding: 0 .25rem .75rem; }

  .giveup { margin-top: 1.5vh; background: none; border: 1px solid #ffffff55; font-size: max(13px, 1.8vh); padding: .4em 1.2em; opacity: .75; }
  .giveup:hover { opacity: 1; }
  .giveup.armed { background: #fff; color: var(--work); opacity: 1; font-weight: 700; }

  /* ---------- running screen ---------- */
  #run {
    height: 100%; display: grid; grid-template-rows: auto 1fr auto;
    padding: 3vh 4vw;
  }
  .top { display: flex; justify-content: space-between; font-size: max(16px, 3vh); opacity: .85; font-variant-numeric: tabular-nums; }
  .center { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; }
  .kind { font-size: max(18px, 4vh); letter-spacing: .3em; text-transform: uppercase; opacity: .85; font-weight: 600; }
  .name { font-size: max(28px, 8vh); font-weight: 800; margin-top: .5vh; text-align: center; }
  .clock {
    font-size: min(40vw, 58vh); line-height: 1; font-weight: 800;
    font-variant-numeric: tabular-nums; letter-spacing: -.02em;
  }
  .clock.urgent { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  .bar { width: min(90vw, 1400px); height: 1.4vh; min-height: 8px; background: #ffffff33; border-radius: 99px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: #fff; }
  .bottom { text-align: center; }
  .next { font-size: max(18px, 4.5vh); font-weight: 600; }
  .next .lbl { opacity: .7; font-weight: 400; }
  .keys { margin-top: 1.2vh; font-size: max(12px, 1.8vh); opacity: .55; }
  .breakKeys { margin-top: 2vh; }
  body.break .clock { font-size: min(30vw, 42vh); }
  .breakKeys button { background: #fff; color: var(--rest); font-size: max(18px, 3vh); padding: .8em 2em; }
  kbd { border: 1px solid #ffffff66; border-radius: 4px; padding: 0 .35em; font-family: inherit; }

  body.paused .clock, body.paused .bar { opacity: .3; }
  #pausedTag {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 12vh; font-weight: 900; letter-spacing: .2em; pointer-events: none;
  }

  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #flash.go { animation: flash .7s ease-out; }
  @keyframes flash { 0% { opacity: .85; } 100% { opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    .clock.urgent, #flash.go { animation: none; }
  }
</style>
</head>
<body>

<section id="start">
  <div class="card">
    <h1>Interval Timer</h1>
    <p class="sub" id="sub">Sound and voice cues play at every change.</p>
    <div id="loadError" class="error" hidden></div>
    <div class="modes" role="radiogroup" aria-label="How to run">
      <label><input type="radio" name="mode" value="full"><b>Full session</b><span>Every round, with timed cooldowns in between</span></label>
      <label><input type="radio" name="mode" value="round"><b>One round at a time</b><span>Stops after each round so you can rest as long as you like</span></label>
    </div>
    <div class="resume" id="resume" hidden>
      <span id="resumeText"></span>
      <button type="button" class="link" id="resumeBtn"></button>
    </div>
    <ul class="plan" id="plan"></ul>
    <p class="hint" id="hint"></p>
    <div class="controls">
      <label><input type="checkbox" id="voiceToggle"> Voice announcements</label>
      <label>Volume <input type="range" id="volume" min="0" max="1" step="0.05"></label>
    </div>
    <div class="buttons">
      <button class="primary" id="startBtn" disabled>Start</button>
      <button id="testBtn" title="Play each sound once">Test sounds</button>
    </div>
    <section class="history" id="history" hidden>
      <h2>History</h2>
      <div id="historyError" class="error" hidden></div>
      <ol id="historyList"></ol>
    </section>
  </div>
</section>

<section id="run" hidden>
  <div class="top">
    <span id="step"></span>
    <span id="totalLeft"></span>
  </div>
  <div class="center">
    <div class="kind" id="kind"></div>
    <div class="name" id="name"></div>
    <div class="clock" id="clock">0:00</div>
    <div class="bar"><div id="barFill"></div></div>
  </div>
  <div class="bottom">
    <div class="next" id="next"></div>
    <div class="breakKeys" id="breakKeys" hidden>
      <button class="primary" id="nextRoundBtn"></button>
      <div class="keys"><kbd>Enter</kbd> start next round · <kbd>Esc</kbd> menu (your place is saved)</div>
    </div>
    <div class="keys" id="keys">
      <kbd>Space</kbd> pause · <kbd>→</kbd> skip · <kbd>←</kbd> back · <kbd>M</kbd> mute · <kbd>F</kbd> fullscreen · <kbd>G</kbd> give up · <kbd>Esc</kbd> quit to menu
    </div>
    <button class="giveup" id="giveUpBtn" hidden>Give up</button>
  </div>
  <div id="pausedTag" hidden>PAUSED</div>
</section>

<div id="flash"></div>

<script>
// ============================================================
// SOUNDS: edit these to customize.
// Each note: f = pitch (Hz), t = start offset (s), d = length (s),
//            type = 'square' | 'sine' | 'triangle' | 'sawtooth', v = volume 0..1
// ============================================================
const beeps = (n, f, on, off, type = 'square', v = 0.9) =>
  Array.from({ length: n }, (_, i) => ({ f, t: i * (on + off), d: on, type, v }));

const SOUNDS = {
  tick:      [{ f: 880, t: 0, d: 0.09, type: 'sine', v: 0.7 }],                 // final seconds of each phase
  prepTone:  [{ f: 523, t: 0, d: 0.3, type: 'sine', v: 0.6 }],                  // every 5s while getting ready
  warn:      [{ f: 660, t: 0, d: 0.12 }, { f: 660, t: 0.2, d: 0.12 }],          // 10s before a work period
  go:        [{ f: 660, t: 0, d: 0.15 }, { f: 880, t: 0.18, d: 0.15 }, { f: 1320, t: 0.36, d: 0.5 }],
  workEnd:   beeps(6, 1000, 0.18, 0.12),                                        // the loud BEEPS
  restStart: [{ f: 784, t: 0, d: 0.3, type: 'triangle' }, { f: 523, t: 0.3, d: 0.6, type: 'triangle' }],
  done:      [
    ...[523, 659, 784, 1047].map((f, i) => ({ f, t: i * 0.15, d: 0.15, type: 'triangle' })),
    { f: 1047, t: 0.65, d: 1.2, type: 'triangle' },
  ],
};

// Count-down ticks start this many seconds before a phase ends.
const TICK_FROM = { prep: 5, work: 3, rest: 5 };
const KIND_LABEL = { prep: 'Get ready', work: 'Work', rest: 'Cooldown' };

// ============================================================
// Audio
// ============================================================
let ctx, master;
let volume = 1, muted = false;

function initAudio() {
  if (ctx) { ctx.resume(); return; }
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  master = ctx.createGain();
  const comp = ctx.createDynamicsCompressor();   // stops overlapping notes clipping
  master.connect(comp).connect(ctx.destination);
  applyVolume();
}
function applyVolume() { if (master) master.gain.value = muted ? 0 : volume; }

// Plays a named sound `delay` seconds from now. Returns its length in seconds.
function play(name, delay = 0) {
  const notes = SOUNDS[name];
  if (!ctx || !notes) return 0;
  const t0 = ctx.currentTime + delay + 0.02;
  let end = 0;
  for (const n of notes) {
    const osc = ctx.createOscillator(), g = ctx.createGain();
    const v = n.v ?? 0.8, s = t0 + n.t, e = s + n.d;
    osc.type = n.type || 'square';
    osc.frequency.value = n.f;
    g.gain.setValueAtTime(0, s);
    g.gain.linearRampToValueAtTime(v, s + 0.005);      // short ramps avoid clicks
    g.gain.setValueAtTime(v, e - 0.01);
    g.gain.linearRampToValueAtTime(0, e);
    osc.connect(g).connect(master);
    osc.start(s); osc.stop(e + 0.02);
    end = Math.max(end, n.t + n.d);
  }
  return end;
}

let speechTimer;
function say(text, delay = 0) {
  if (!voiceOn || muted || !('speechSynthesis' in window)) return;
  clearTimeout(speechTimer);
  speechTimer = setTimeout(() => {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.volume = volume;
    speechSynthesis.speak(u);
  }, delay * 1000);
}
function stopSpeech() {
  clearTimeout(speechTimer);
  if ('speechSynthesis' in window) speechSynthesis.cancel();
}

// ============================================================
// Formatting
// ============================================================
const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
function spoken(s) {
  const m = Math.floor(s / 60), r = s % 60, parts = [];
  if (m) parts.push(`${m} minute${m > 1 ? 's' : ''}`);
  if (r) parts.push(`${r} second${r > 1 ? 's' : ''}`);
  return parts.join(' ');
}

// ============================================================
// Timer state
// ============================================================
let base = [];         // the schedule's phases as loaded
let schedule = [], scheduleId = '', voiceOn = true;   // schedule = base with your rest-time changes applied
let works = [];        // schedule indexes of the work phases ("rounds")
let mode = 'full';     // 'full': whole schedule with timed rests · 'round': one round, then an open-ended break
let startAt = 0;       // schedule index of the round to start from
let phases = [];       // this session's phases, built from the schedule by buildRun()
let brk = null;        // set while on the open-ended break between rounds
let idx = -1;          // current phase index
let endAt = 0;         // performance.now() when the current phase ends
let pausedLeft = null; // ms left when paused, else null
let lastSec = null;    // last whole second shown, so per-second cues fire once
let loop = null, wakeLock = null;
let sess = null;       // the session being recorded for the history log (see "Session log")

const $ = id => document.getElementById(id);
const now = () => performance.now();
const cur = () => phases[idx];
const nextPhase = () => phases[idx + 1];
const msLeft = () => pausedLeft ?? Math.max(0, endAt - now());

const roundNo = si => works.indexOf(si) + 1;
const nextWork = si => works.find(w => w > si);

// The get-ready countdown used when starting partway through: the schedule's own, or a short default.
function prepPhase() {
  const p = schedule.find(q => q.kind === 'prep');
  return { ...(p || { name: 'Get Ready', kind: 'prep', seconds: 10 }), si: -1 };
}

// Phases for this session. Each keeps `si`, its schedule index (-1 for an added get-ready).
function buildRun() {
  const tagged = schedule.map((p, si) => ({ ...p, si }));
  if (mode === 'round') return [prepPhase(), tagged[startAt]];
  return startAt === works[0] ? tagged : [prepPhase(), ...tagged.slice(startAt)];
}

// A round counts as done when you leave it forward (time ran out, or → skip).
// Saving the next round lets you close the timer and pick up there later.
function recordDone(si) {
  const nx = nextWork(si);
  save('progress', nx === undefined ? null : { schedule: scheduleId, done: si, next: nx, at: Date.now() });
}

function savedProgress() {
  const p = load('progress', null);
  return p && p.schedule === scheduleId && works.includes(p.next) ? p : null;
}

// continuing: true when one-round-at-a-time mode moves on from a break, so it's the same session
function start(continuing = false) {
  initAudio();
  if (!continuing || !sess) beginSession();
  phases = buildRun();
  brk = null; idx = -1; pausedLeft = null;
  $('start').hidden = true;
  $('run').hidden = false;
  $('keys').hidden = false;
  $('breakKeys').hidden = true;
  $('pausedTag').hidden = true;
  document.documentElement.requestFullscreen?.().catch(() => {});
  requestWakeLock();
  clearInterval(loop);
  loop = setInterval(update, 50);
  enterPhase(0, { at: now(), auto: false });
}

function startNextRound() {
  startAt = brk.next;
  start(true);
}

function quitToMenu() {
  if (sess) {
    if (!sess.outcome && cur()?.kind === 'work') closeRound('stopped');
    logSession(sess);
    sess = null;
    save('current', null);
  }
  clearInterval(loop); loop = null;
  stopSpeech();
  idx = -1; pausedLeft = null; brk = null;
  wakeLock?.release().catch(() => {}); wakeLock = null;
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  document.body.className = '';
  document.title = 'Interval Timer';
  $('run').hidden = true;
  $('start').hidden = false;
  startAt = savedProgress()?.next ?? works[0];
  renderMenu();
  renderHistory();
  $('startBtn').focus();
}

// at:   when this phase began (lets back-to-back transitions stay drift-free)
// auto: true when the previous phase ran out, false for skip/back/start
function enterPhase(i, { at, auto }) {
  const prev = phases[i - 1];
  stopSpeech();
  if (i === idx + 1 && cur()?.kind === 'work') recordDone(cur().si);
  if (cur()?.kind === 'work') {
    // Leaving a round forward finishes it; going back means this attempt doesn't count
    if (i > idx) closeRound(auto ? 'done' : 'skipped');
    else dropRound(cur().si);
  }

  // Sound for the phase that just ended
  let delay = 0;
  if (auto && prev?.kind === 'work') delay = play('workEnd') + 0.25;

  if (i >= phases.length) return finish(delay);

  idx = i;
  const p = cur(), nx = nextPhase();
  endAt = at + p.seconds * 1000;
  if (pausedLeft !== null) pausedLeft = p.seconds * 1000;
  lastSec = p.seconds;
  if (p.kind === 'work') beginRound(p);
  updateGiveUp();

  // Sound + voice for the phase that's starting
  // In round-at-a-time mode every round ends its session; only the schedule's last round is "the last one"
  const isFinal = p.kind !== 'work' || nextWork(p.si) === undefined;
  const cue = { prep: 'prepTone', work: 'go', rest: 'restStart' }[p.kind];
  const cueLen = play(cue, delay);
  const after = delay + cueLen + 0.1;
  if (p.kind === 'prep') {
    say(`Get ready. ${nx ? nx.name + ' starts' : 'Starting'} in ${spoken(p.seconds)}.`, after);
  } else if (p.kind === 'work') {
    say(`${p.name}. ${spoken(p.seconds)}. ${nx || !isFinal ? 'Go!' : 'Last one. Go!'}`, after);
  } else {
    say(`${p.name}. ${spoken(p.seconds)}.${nx ? ` Next up: ${nx.name}.` : ''}`, after);
  }

  flash();
  document.body.className = p.kind + (pausedLeft !== null ? ' paused' : '');
  $('kind').textContent = KIND_LABEL[p.kind];
  $('name').textContent = p.name;
  $('step').textContent = mode === 'round'
    ? `Round ${roundNo(phases[phases.length - 1].si)} of ${works.length}`
    : `Step ${i + 1} of ${phases.length}`;
  $('next').innerHTML = nx
    ? `<span class="lbl">Up next:</span> ${escapeHTML(nx.name)} · ${fmt(nx.seconds)}`
    : isFinal ? `<span class="lbl">Last one — finish strong</span>`
    : `<span class="lbl">Then rest as long as you like</span>`;
  render();
}

function finish(delay) {
  const last = phases[phases.length - 1];
  const nx = last.kind === 'work' ? nextWork(last.si) : undefined;
  if (mode === 'round' && nx !== undefined) return takeBreak(last.si, nx, delay);

  endSession('completed');
  play('done', delay);
  say('All done. Great work.', delay + 2);
  flash();
  showEnd();
}

// Two presses within 3 seconds, so a stray click or key can't end your session.
let giveUpArmed = 0, giveUpTimer;
function giveUp() {
  if (!sess || sess.outcome) return;
  if (Date.now() - giveUpArmed > 3000) {
    giveUpArmed = Date.now();
    $('giveUpBtn').textContent = 'Press again to give up';
    $('giveUpBtn').classList.add('armed');
    clearTimeout(giveUpTimer);
    giveUpTimer = setTimeout(updateGiveUp, 3000);
    return;
  }
  giveUpArmed = 0;
  if (cur()?.kind === 'work') closeRound('gave_up');
  if (!sess.rounds.length) return quitToMenu();   // nothing done yet, so nothing to log
  stopSpeech();
  endSession('gave_up');
  save('progress', null);   // giving up ends the day: next time starts from the first round
  play('restStart');
  say('Session saved. Good effort.', 1);
  showEnd();
}

function updateGiveUp() {
  clearTimeout(giveUpTimer);
  giveUpArmed = 0;
  $('giveUpBtn').textContent = 'Give up';
  $('giveUpBtn').classList.remove('armed');
  $('giveUpBtn').hidden = !sess || !!sess.outcome;
}

// The screen after the last round, or after giving up
function showEnd() {
  clearInterval(loop); loop = null;
  idx = phases.length; brk = null; pausedLeft = null;
  const rounds = sess?.rounds ?? [], last = rounds.at(-1);
  const done = rounds.filter(r => r.result === 'done').length;
  const gaveUp = sess?.outcome === 'gave_up';
  document.body.className = gaveUp ? 'ended' : 'done';
  $('kind').textContent = gaveUp ? 'Session over' : 'Complete';
  $('name').textContent = !gaveUp ? 'All done'
    : last?.result === 'gave_up' ? `Gave up in ${last.name}` : `Gave up after ${last?.name}`;
  $('clock').textContent = `${done}/${works.length}`;
  $('clock').classList.remove('urgent');
  $('barFill').style.width = `${(done / works.length) * 100}%`;
  $('step').textContent = `${done} of ${works.length} rounds done`;
  $('totalLeft').textContent = sess ? `${fmt(secs(sess.endedAt - sess.startedAt))} session` : '';
  $('next').innerHTML = `<span class="lbl">Saved to history · press</span> Esc <span class="lbl">for the menu</span>`;
  $('keys').hidden = true;
  $('breakKeys').hidden = true;
  $('pausedTag').hidden = true;
  updateGiveUp();
  document.title = `${gaveUp ? 'Session over' : 'Done'} · Interval Timer`;
}

// Open-ended rest between rounds: the clock counts up, and the next round waits for you.
function takeBreak(doneSi, nextSi, delay) {
  idx = phases.length;
  const done = schedule[doneSi], nx = schedule[nextSi];
  // The schedule's own cooldowns between these rounds, shown as a suggestion. The next round
  // opens with a get-ready countdown, which is rest too, so the chime comes that much earlier.
  const rest = plannedRest(doneSi, nextSi), prep = prepPhase().seconds;
  const suggest = Math.max(0, rest - prep);
  brk = { next: nextSi, from: now(), suggest, chimed: suggest === 0 };

  play('restStart', delay);
  say(`${done.name} done. Rest as long as you need.`, delay + 1);
  flash();
  document.body.className = 'rest break';
  $('kind').textContent = 'Rest';
  $('name').textContent = `${done.name} done`;
  $('clock').classList.remove('urgent');
  $('step').textContent = `Round ${roundNo(doneSi)} of ${works.length} done`;
  $('totalLeft').textContent = suggest ? `Planned rest ${fmt(rest)} · includes ${fmt(prep)} get-ready` : '';
  $('next').innerHTML = `<span class="lbl">Up next:</span> ${escapeHTML(nx.name)} · ${fmt(nx.seconds)}`;
  $('nextRoundBtn').textContent = `Start ${nx.name}`;
  $('keys').hidden = true;
  $('breakKeys').hidden = false;
  updateGiveUp();
  renderBreak();
}

function renderBreak() {
  const s = Math.floor((now() - brk.from) / 1000);
  $('clock').textContent = fmt(s);
  $('barFill').style.width = `${brk.suggest ? Math.min(1, s / brk.suggest) * 100 : 100}%`;
  document.title = `Resting ${fmt(s)} · Interval Timer`;
  if (!brk.chimed && s >= brk.suggest) {
    brk.chimed = true;
    play('prepTone');
    say(`Time to get ready. Start ${schedule[brk.next].name} when you're ready.`, 0.5);
  }
}

function update() {
  if (brk) return renderBreak();
  if (idx < 0 || idx >= phases.length) return;
  const left = msLeft();
  if (left <= 0 && pausedLeft === null) {
    // Carry the exact end time forward so a late tick (e.g. background tab) doesn't add drift.
    return enterPhase(idx + 1, { at: endAt, auto: true });
  }
  const sec = Math.ceil(left / 1000);
  if (sec !== lastSec) { lastSec = sec; onSecond(sec); }
  render();
}

// Cues that fire once as each new second appears on the clock
function onSecond(sec) {
  const p = cur(), nx = nextPhase();
  if (sec <= TICK_FROM[p.kind] && sec >= 1) { play('tick'); return; }
  if (sec === 10 && nx?.kind === 'work' && p.seconds > 15) {
    play('warn');
    say(`${nx.name} in 10 seconds.`, 0.4);
    return;
  }
  if (p.kind === 'prep' && sec % 5 === 0) play('prepTone');
}

function render() {
  const p = cur(), left = msLeft();
  const sec = Math.ceil(left / 1000);
  const clock = $('clock');
  clock.textContent = fmt(sec);
  clock.classList.toggle('urgent', sec <= 5 && pausedLeft === null);
  $('barFill').style.width = `${(1 - left / (p.seconds * 1000)) * 100}%`;
  const rest = phases.slice(idx + 1).reduce((a, q) => a + q.seconds, 0);
  $('totalLeft').textContent = `${fmt(sec + rest)} total left`;
  document.title = `${fmt(sec)} · ${p.name}`;
}

function togglePause() {
  if (idx < 0 || idx >= phases.length) return;
  const r = cur().kind === 'work' ? openRound() : null;
  if (pausedLeft === null) {
    pausedLeft = Math.max(0, endAt - now());
    stopSpeech();
    if (r) r.pausedAt = Date.now();
  } else {
    endAt = now() + pausedLeft;
    pausedLeft = null;
    if (r) unpause(r);
  }
  touch();
  document.body.classList.toggle('paused', pausedLeft !== null);
  $('pausedTag').hidden = pausedLeft === null;
  render();
}

function skip(dir) {
  if (idx < 0) return;
  if (brk && dir > 0) return startNextRound();
  if (idx >= phases.length) {            // from the done/break screen, ← goes back into the last phase
    if (dir > 0 || sess?.outcome === 'gave_up') return;
    if (sess) { delete sess.outcome; delete sess.endedAt; }   // the session is back on; it's re-logged when it ends
    brk = null;
    $('keys').hidden = false;
    $('breakKeys').hidden = true;
    clearInterval(loop);
    loop = setInterval(update, 50);
    return enterPhase(phases.length - 1, { at: now(), auto: false });
  }
  let target = idx + dir;
  // ← restarts the current phase unless you're within its first 3 seconds
  if (dir < 0 && cur().seconds * 1000 - msLeft() > 3000) target = idx;
  if (target < 0) target = 0;
  enterPhase(target, { at: now(), auto: false });
}

function flash() {
  const f = $('flash');
  f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
}

async function requestWakeLock() {
  wakeLock?.release().catch(() => {});
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch { /* not supported; ignore */ }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && loop) requestWakeLock();
});

const escapeHTML = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ============================================================
// Session log: what you actually did, kept in history.json by the Go server (see /history).
// A session runs from Start until the last round ends, you give up, or you quit to the menu.
// In one-round-at-a-time mode it carries on across the breaks.
// The live session is also kept in state ("current"), so closing the tab mid-session still logs it.
// ============================================================
const secs = ms => Math.max(0, Math.round(ms / 1000));
const touch = () => { if (sess) save('current', sess); };
const openRound = () => { const r = sess?.rounds.at(-1); return r && !r.result ? r : null; };
const plannedRest = (fromSi, toSi) =>
  schedule.slice(fromSi + 1, toSi).reduce((a, p) => a + (p.kind === 'rest' ? p.seconds : 0), 0);

function beginSession() {
  sess = { id: new Date().toISOString(), startedAt: Date.now(), mode, roundsTotal: works.length, rounds: [] };
  touch();
}

function endSession(outcome) {
  sess.outcome = outcome;
  sess.endedAt = Date.now();
  touch();
  logSession(sess);
}

function beginRound(p) {
  if (!sess) return;
  sess.rounds = sess.rounds.filter(r => r.si < p.si);   // redoing a round replaces it and anything after
  const prev = sess.rounds.at(-1);
  const r = { si: p.si, round: roundNo(p.si), name: p.name, plannedSec: p.seconds, startedAt: Date.now() };
  // Rest = from the end of the last round to the start of this one, however it was spent
  if (prev?.endedAt && nextWork(prev.si) === p.si) {
    r.rest = { plannedSec: plannedRest(prev.si, p.si), actualSec: secs(r.startedAt - prev.endedAt) };
  }
  if (pausedLeft !== null) r.pausedAt = r.startedAt;
  sess.rounds.push(r);
  touch();
}

// result: 'done' (time ran out) · 'skipped' (→ with time left) · 'gave_up' · 'stopped' (quit or closed)
// Call while the round is still the current phase, so msLeft() is its time left.
function closeRound(result) {
  const r = openRound();
  if (!r) return;
  r.endedAt = Date.now();
  r.workedSec = secs(r.plannedSec * 1000 - msLeft());
  unpause(r);
  r.result = result;
  touch();
}

function unpause(r) {
  if (!r.pausedAt) return;
  r.pausedSec = (r.pausedSec || 0) + secs(Date.now() - r.pausedAt);
  delete r.pausedAt;
}

function dropRound(si) {
  if (!sess) return;
  sess.rounds = sess.rounds.filter(r => r.si !== si);
  touch();
}

// Queues a copy of the session in state ("unsaved") and sends it; it stays queued until the
// server has it. Sending the same session again replaces the earlier copy.
function logSession(s) {
  if (!s.rounds.length) return;   // quit during the first get-ready: nothing happened
  const entry = structuredClone(s);
  entry.outcome ??= 'stopped';
  entry.endedAt ??= Date.now();
  const open = entry.rounds.at(-1);
  if (!open.result) { open.result = 'stopped'; delete open.pausedAt; }   // tab closed mid-round
  entry.v = Date.now();
  save('unsaved', [...load('unsaved', []).filter(u => u.id !== entry.id), entry]);
  sendUnsaved();
}

function sendUnsaved() {
  for (const s of load('unsaved', [])) {
    fetch('history', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(s), keepalive: true })
      .then(r => {
        if (!r.ok) throw new Error();
        save('unsaved', load('unsaved', []).filter(u => !(u.id === s.id && u.v === s.v)));
        logged = [...logged.filter(h => h.id !== s.id), s];
        if (!$('start').hidden) renderHistory();
      })
      .catch(() => { /* stays queued; retried next time the page loads */ });
  }
}

addEventListener('pagehide', () => {
  if (sess && !sess.outcome && cur()?.kind === 'work') closeRound('stopped');
  flushState();
});

// ============================================================
// Keyboard
// ============================================================
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const running = !$('run').hidden;
  if (!running) {
    // A focused button handles its own Enter (e.g. picking a round in the plan)
    if (e.key === 'Enter' && e.target.tagName !== 'BUTTON' && !$('startBtn').disabled) { e.preventDefault(); start(); }
    return;
  }
  switch (e.key) {
    case 'Enter': if (brk) { e.preventDefault(); startNextRound(); } break;
    case ' ': e.preventDefault(); togglePause(); break;
    case 'ArrowRight': skip(+1); break;
    case 'ArrowLeft': skip(-1); break;
    case 'g': case 'G': giveUp(); break;
    case 'm': case 'M':
      muted = !muted; applyVolume(); if (muted) stopSpeech(); break;
    case 'f': case 'F':
      document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
      break;
    case 'Escape':
      // In fullscreen the browser uses Esc to exit fullscreen first; a second Esc quits.
      if (!document.fullscreenElement) quitToMenu();
      break;
  }
});

// ============================================================
// Start screen
// ============================================================
// Settings and progress live in a file via the Go server (see /state in main.go), not localStorage,
// because the port (and so the browser's storage) changes every run.
let state = {}, saveTimer = null;
function load(key, fallback) { return state[key] ?? fallback; }
function save(key, val) {
  state[key] = val;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushState, 300);   // the volume slider fires constantly
}
function flushState() {
  if (saveTimer === null) return;
  clearTimeout(saveTimer); saveTimer = null;
  fetch('state', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(state), keepalive: true })
    .catch(() => { /* server gone; nothing useful to do */ });
}

function when(ms) {
  const d = new Date(ms), today = new Date();
  const time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const days = Math.round((new Date(today.toDateString()) - new Date(d.toDateString())) / 864e5);
  if (days === 0) return `today at ${time}`;
  if (days === 1) return `yesterday at ${time}`;
  return `on ${d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' })}`;
}

// Rest and get-ready times you've changed with − / +, by schedule index. Rounds keep the schedule's time.
const REST_STEP = 15, REST_MIN = 15;
function customRest() {
  const c = load('restTimes', null);
  return c?.schedule === scheduleId ? c.seconds : {};
}
function applyRestTimes() {
  const c = customRest();
  schedule = base.map((p, si) => p.kind !== 'work' && c[si] ? { ...p, seconds: c[si] } : p);
}
function adjustRest(si, delta) {
  const c = { ...customRest() };
  const s = Math.max(REST_MIN, schedule[si].seconds + delta);
  if (s === base[si].seconds) delete c[si]; else c[si] = s;
  save('restTimes', { schedule: scheduleId, seconds: c });
  applyRestTimes();
  renderMenu();
}

let logged = [];   // sessions the server has in history.json
const RESULT = { done: '✓', skipped: 'Skipped', gave_up: 'Gave up', stopped: 'Stopped' };
const OUTCOME = { completed: 'Completed', gave_up: 'Gave up', stopped: 'Stopped' };
const signed = s => (s < 0 ? '−' : '+') + fmt(Math.abs(s));

function dateLabel(ms) {
  const d = new Date(ms);
  const date = d.toLocaleDateString([], {
    weekday: 'short', month: 'short', day: 'numeric',
    year: d.getFullYear() === new Date().getFullYear() ? undefined : 'numeric',
  });
  return `${date} · ${d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`;
}

function renderHistory() {
  const unsaved = load('unsaved', []).filter(u => !logged.some(h => h.id === u.id));
  const list = [...logged, ...unsaved].sort((a, b) => b.startedAt - a.startedAt);
  $('history').hidden = !list.length && $('historyError').hidden;
  $('historyList').innerHTML = list.map(s => {
    const done = s.rounds.filter(r => r.result === 'done').length;
    const worked = s.rounds.reduce((a, r) => a + (r.workedSec ?? 0), 0);
    const paused = s.rounds.reduce((a, r) => a + (r.pausedSec ?? 0), 0);
    const rows = s.rounds.map(r => (r.rest
      ? `<tr class="restrow"><td>Rest</td><td>${fmt(r.rest.actualSec)}</td><td>${fmt(r.rest.plannedSec)} planned</td>`
        + `<td>${r.rest.actualSec === r.rest.plannedSec ? '' : signed(r.rest.actualSec - r.rest.plannedSec)}</td></tr>`
      : '')
      + `<tr><td>${escapeHTML(r.name)}</td><td>${r.workedSec == null ? '—' : fmt(r.workedSec)}</td>`
      + `<td>of ${fmt(r.plannedSec)}${r.pausedSec ? ` · paused ${fmt(r.pausedSec)}` : ''}</td>`
      + `<td>${RESULT[r.result] ?? ''}</td></tr>`).join('');
    const first = s.rounds[0];
    const meta = [
      s.mode === 'round' ? 'One round at a time' : 'Full session',
      first && first.round !== 1 ? `started at ${escapeHTML(first.name)}` : '',
      `${fmt(worked)} work${paused ? ` · ${fmt(paused)} paused` : ''} · ${fmt(secs(s.endedAt - s.startedAt))} total`,
    ].filter(Boolean).join(' · ');
    return `<li><details><summary>
        <span>${dateLabel(s.startedAt)}</span>
        <span class="rounds"><b>${done}</b>/${s.roundsTotal} rounds</span>
        <span class="tag ${s.outcome}">${OUTCOME[s.outcome] ?? s.outcome}</span>
      </summary>
      <table>${rows}</table>
      <div class="meta"><span>${meta}</span>${logged.some(h => h.id === s.id)
        ? `<button type="button" class="link" data-del="${escapeHTML(s.id)}">Delete</button>` : '<span>Not saved yet</span>'}</div>
    </details></li>`;
  }).join('');
}

$('historyList').addEventListener('click', e => {
  const b = e.target.closest('button[data-del]');
  if (!b || !confirm('Delete this session from your history?')) return;
  const id = b.dataset.del;
  fetch(`history?id=${encodeURIComponent(id)}`, { method: 'DELETE' })
    .then(async r => { if (!r.ok) throw new Error((await r.text()).trim()); })
    .then(() => { logged = logged.filter(h => h.id !== id); renderHistory(); })
    .catch(err => alert(`Couldn't delete it: ${err.message || 'the timer server isn\'t running'}`));
});

function renderMenu() {
  const colors = { prep: 'var(--prep)', work: 'var(--work)', rest: 'var(--rest)' };
  const run = buildRun();
  const total = run.reduce((a, p) => a + p.seconds, 0);
  const startName = escapeHTML(schedule[startAt].name);

  $('plan').innerHTML = schedule.map((p, si) => {
    // The get-ready always runs; otherwise dim what this session skips
    const dim = p.kind !== 'prep' && (si < startAt || (mode === 'round' && si > startAt));
    const name = escapeHTML(p.name);
    const label = `<span class="dot" style="background:${colors[p.kind]}"></span>${name}`
      + (si === startAt ? '<span class="here">Start</span>' : '');
    if (p.kind === 'work') {
      return `<li class="${dim ? 'dim' : ''}"><button type="button" data-si="${si}" title="Start from ${name}">`
        + `${label}<span class="dur">${fmt(p.seconds)}</span></button></li>`;
    }
    const changed = p.seconds !== base[si].seconds;
    return `<li class="${dim ? 'dim' : ''}">${label}<span class="adj">`
      + `<button type="button" data-adj="${si}" data-d="${-REST_STEP}" aria-label="Shorter ${name}">−</button>`
      + `<span class="dur${changed ? ' changed' : ''}"${changed ? ` title="Schedule default ${fmt(base[si].seconds)}"` : ''}>${fmt(p.seconds)}</span>`
      + `<button type="button" data-adj="${si}" data-d="${REST_STEP}" aria-label="Longer ${name}">+</button>`
      + '</span></li>';
  }).join('') + `<li class="total">This session<span class="dur">${fmt(total)}</span></li>`;

  const anyChanged = Object.keys(customRest()).length > 0;
  $('hint').innerHTML = 'Click a round to start from it. Use − and + to change rest times.'
    + (anyChanged ? ' <button type="button" class="link" id="resetRest">Reset to schedule</button>' : '');

  $('startBtn').innerHTML = mode === 'round' ? `Start ${startName}`
    : startAt === works[0] ? 'Start' : `Start from ${startName}`;
  const prep = run[0].kind === 'prep' ? ` Starts with a ${fmt(run[0].seconds)} get-ready countdown.` : '';
  $('sub').textContent = (mode === 'round'
    ? 'Runs one round, then waits while you rest. Your place is saved, so you can close this and come back later.'
    : 'Runs every round with timed cooldowns in between.') + prep;

  const prog = savedProgress();
  $('resume').hidden = !prog;
  if (prog) {
    $('resumeText').textContent = `You finished ${schedule[prog.done]?.name ?? 'a round'} ${when(prog.at)}.`;
    const target = startAt === prog.next ? works[0] : prog.next;
    $('resumeBtn').textContent = startAt === prog.next ? 'Start from the beginning instead' : `Pick up at ${schedule[prog.next].name}`;
    $('resumeBtn').onclick = () => { startAt = target; renderMenu(); $('startBtn').focus(); };
  }
}

$('plan').addEventListener('click', e => {
  const adj = e.target.closest('button[data-adj]');
  if (adj) return adjustRest(+adj.dataset.adj, +adj.dataset.d);
  const b = e.target.closest('button[data-si]');
  if (!b) return;
  startAt = +b.dataset.si;
  renderMenu();
  $('startBtn').focus();
});
for (const r of document.querySelectorAll('input[name=mode]')) {
  r.addEventListener('change', () => { mode = r.value; save('mode', mode); renderMenu(); });
}
$('volume').addEventListener('input', e => { volume = +e.target.value; save('volume', volume); applyVolume(); });
$('voiceToggle').addEventListener('change', e => { voiceOn = e.target.checked; save('voice', voiceOn); });
$('startBtn').addEventListener('click', start);
$('hint').addEventListener('click', e => {
  if (e.target.id !== 'resetRest') return;
  save('restTimes', null);
  applyRestTimes();
  renderMenu();
});
$('nextRoundBtn').addEventListener('click', e => { e.currentTarget.blur(); startNextRound(); });
// Blur so a later Space (pause) or Enter doesn't press it again
$('giveUpBtn').addEventListener('click', e => { e.currentTarget.blur(); giveUp(); });
$('testBtn').addEventListener('click', () => {
  initAudio();
  let t = 0;
  for (const name of ['tick', 'prepTone', 'warn', 'go', 'workEnd', 'restStart', 'done']) t += play(name, t) + 0.5;
  say('This is the voice.', t);
});

const getJSON = url => fetch(url).then(async r => {
  if (!r.ok) throw new Error((await r.text()).trim() || `HTTP ${r.status}`);
  return r.json();
});

Promise.all([
  getJSON('schedule.json'),
  getJSON('state').catch(() => ({})),
  getJSON('history').catch(err => { $('historyError').hidden = false; $('historyError').textContent = `Couldn't read your history: ${err.message}`; return []; }),
])
  .then(([s, st, h]) => {
    state = st;
    logged = h;
    base = s.phases;
    scheduleId = s.id;
    applyRestTimes();
    works = schedule.flatMap((p, si) => p.kind === 'work' ? [si] : []);
    voiceOn = load('voice', s.voice !== false);
    $('voiceToggle').checked = voiceOn;
    volume = load('volume', 1);
    $('volume').value = volume;
    mode = load('mode', 'full') === 'round' ? 'round' : 'full';
    document.querySelector(`input[name=mode][value=${mode}]`).checked = true;
    startAt = savedProgress()?.next ?? works[0];
    // A session still open from last time (tab closed or reloaded mid-session) gets logged now
    const leftover = load('current', null);
    if (leftover) { logSession(leftover); save('current', null); }
    sendUnsaved();
    renderMenu();
    renderHistory();
    $('startBtn').disabled = false;
    $('startBtn').focus();
  })
  .catch(err => {
    $('loadError').hidden = false;
    $('loadError').textContent = `Couldn't load the schedule (${err.message}). Start the timer with "go run ." in the timer folder, not by opening index.html directly.`;
  });
</script>
</body>
</html>
